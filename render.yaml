services:
  - type: web
    name: skyguard-ai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PROJECT_NAME
        value: SkyGuard AI — Intelligent AWS Anomaly Detection Platform
      - key: SECRET_KEY
        generateValue: true
      - key: ALERT_COOLDOWN_SECONDS
        value: "300"
